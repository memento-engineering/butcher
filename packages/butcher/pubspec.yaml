name: butcher
description: Mutation testing for Dart; rewrites the source into mutants and scores which ones the tests kill.
version: 0.1.0
repository: https://github.com/memento-engineering/butcher

environment:
  sdk: ^3.12.0

resolution: workspace

executables:
  butcher: butcher

dependencies:
  analyzer: ^14.1.0
  args: ^2.7.0
  butcher_process: ^0.1.0
  butcher_report: ^0.1.0
  glob: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
