name: CI

on:
  push:
    # main and tags run this job through the publish workflow, which calls it.
    branches-ignore: [main]
  pull_request:
  workflow_call:

# A newer push on the same ref makes the running check obsolete. The group is
# a literal: when called, `github.workflow` is the caller's name, and sharing
# its group would let the caller cancel the job it waits on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # The engine branches on the platform (process kill, path handling).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bin example
      - run: dart analyze lib test bin example
      - run: dart test
