name: Publish

# One release per package, tagged as the published package name, a hyphen, the
# letter v and the version. The trailing wildcard carries a prerelease suffix,
# so `butcher_report-v0.2.0-beta.1` triggers this too.
#
# A push carrying more than three tags at once fires no workflow at all, and
# this workspace has exactly three publishable members -- so tags are pushed
# one at a time, never as a batch.
on:
  push:
    tags:
      - 'butcher-v[0-9]+.[0-9]+.[0-9]+*'
      - 'butcher_process-v[0-9]+.[0-9]+.[0-9]+*'
      - 'butcher_report-v[0-9]+.[0-9]+.[0-9]+*'

# Each release is its own ref, so this never cancels a sibling package's run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which member does this tag release? Every job below works from the answer.
  parse:
    name: Parse the release tag
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.tag.outputs.directory }}
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Resolve the member directory
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          directory="$(sh .github/parse_release_tag.sh "$RELEASE_REF")"
          tag="${RELEASE_REF#refs/tags/}"
          {
            echo "directory=$directory"
            echo "package=${tag%%-v[0-9]*}"
            echo "version=${tag#*-v}"
          } >> "$GITHUB_OUTPUT"
          echo "$tag releases $directory"

  # The same matrix that guards every other branch, run on this ref.
  test:
    name: Test
    uses: ./.github/workflows/ci.yaml

  verify:
    name: Verify release
    needs: [parse, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      # One resolution at the workspace root covers every member.
      - run: dart pub get
      - name: Dry run the publish
        working-directory: ${{ needs.parse.outputs.directory }}
        run: dart pub publish --dry-run
      # ADR 0015: the package keeps a full pana score at all times. The
      # threshold below is the largest deduction measured on this tree rather
      # than a guess, and these are the measurements it was set from.
      #
      # pana measurements (pana 0.23.15, Dart 3.12.2):
      #   packages/butcher_process  160/160  deduction 0
      #   packages/butcher_report   160/160  deduction 0
      #   packages/butcher          160/160  deduction 0
      #
      # The two leaves were measured on 2026-09-22. packages/butcher was held
      # back until they were live, because it declares caret constraints on
      # them and pana resolves those from pub.dev exactly as a publish does.
      # Both leaves published at 0.1.0 on 2026-09-23, so its measurement was
      # taken that day against the hosted siblings rather than the workspace.
      # Its deduction is 0, so the threshold below stays at 0.
      - name: Score with pana
        working-directory: ${{ needs.parse.outputs.directory }}
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .

  publish:
    name: Publish to pub.dev
    needs: [parse, verify]
    permissions:
      id-token: write # requests the JWT pub.dev authenticates with
    # The Dart team's reusable workflow, so this repository stores no
    # publishing credential and has nothing to rotate.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      working-directory: ${{ needs.parse.outputs.directory }}

  release:
    name: Create GitHub release
    needs: [parse, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ needs.parse.outputs.package }}
          RELEASE_VERSION: ${{ needs.parse.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$RELEASE_PACKAGE $RELEASE_VERSION" --generate-notes
