name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same matrix that guards every other branch, run on this ref.
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
      # ADR 0015: the package keeps a full pana score at all times.
      - name: Score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .

  publish:
    name: Publish to pub.dev
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # requests the JWT pub.dev authenticates with
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@v7
      - run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
