name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

# A newer push on the same ref makes the running check obsolete. The group is
# a literal: when called, `github.workflow` is the caller's name, and sharing
# its group would let the caller cancel the job it waits on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # The engine branches on the platform: it kills process trees by
        # process group on POSIX and by job object on Windows, and it resolves
        # and copies paths differently on each. macOS is not redundant with
        # Linux here -- the POSIX kill path meets a different kernel and a
        # different `dart` distribution there.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The format check must run under one known SDK: `dart format`'s
      # canonical layout differs between SDK minors (3.12.2 and 3.13.4
      # disagree on engine_test.dart, and neither is idempotent on the
      # other's output). 3.12.2 is the SDK the org's contributors run
      # (Flutter stable's Dart); bump it together with the `environment:
      # sdk:` floor.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      # One resolution at the workspace root covers every member.
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      # The slow selection runs in its own job below; running it here too
      # would pay for the same suites twice on every leg.
      - name: Test butcher
        working-directory: packages/butcher
        run: dart test -x slow
      - name: Test butcher_process
        working-directory: packages/butcher_process
        run: dart test
      - name: Test butcher_report
        working-directory: packages/butcher_report
        run: dart test

  # The suites that spawn real subprocesses -- a real `dart test` run, a real
  # `dart pub get`, a real process tree to kill, and the end-to-end self run.
  # They are the slowest legs and the ones most likely to behave differently
  # per platform, so they run on every platform, in their own job, after the
  # fast gate has already said the tree is sound.
  slow:
    name: Slow suites
    needs: [test]
    strategy:
      fail-fast: false
      # No macOS leg here while the repository is private: macOS runners bill
      # at ten times Linux and the slow suites are the long ones. They run on
      # the maintainer's Mac instead (dart test -t slow in packages/butcher),
      # which is the macOS receipt until go-public, when the leg comes back.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      # Only `butcher` tags suites slow; the other members have none, and a
      # selection that finds no suite is an error rather than a pass.
      - name: Test butcher
        working-directory: packages/butcher
        run: dart test -t slow

  # Branch protection needs one check name that does not change when the matrix
  # does, so it requires this job and never the legs.
  ci-required:
    name: CI required
    needs: [test, slow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix leg succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.slow.result }}" != "success" ]; then
            echo "slow result: ${{ needs.slow.result }}"
            exit 1
          fi
