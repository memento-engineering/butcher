version: 2

# This is a pub workspace: Dependabot's pub updater refuses a per-member
# directory ("dependency_services failed: Only apply dependency_services to
# the root of the workspace"). One entry at the workspace root drives the
# dependency_services run that reads every member's pubspec and updates each
# member's own constraints from there.
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
